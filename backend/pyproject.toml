[project]
name = "backend"
version = "0.1.0"
description = "Resume tailoring automation for internship applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    "click>=8.1.0",
    "rich>=13.0.0",
    "playwright>=1.44.0",
    "greenlet==3.2.4; sys_platform == 'win32' and python_version >= '3.14'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
